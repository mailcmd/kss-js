<template kss-tpl-id="table">
  <style>
    .filled {
      background-color: firebrick;
      color: white;
    }
  </style>
  <button onclick="[$$change()]">CHANGE</button><br>
  <table border="1">
    <tr :foreach="$$table" :as="row" :index="ridx">
      <td align="center" style="width: 32px;" class="{$$col.c}" :foreach="$$row" :as="col" :index="cidx">
        <text :content="{$$col.v}"></text>
      </td>
    </tr>
  </table>
  <br/>
  <ul :foreach="$$uls" :as="ul" :index="uix">
    <text :content="UL IDX: {$$ownIndex} ->  {$$uix}"></text>
    <li :foreach="$$ul" :as="li" :index="ix">
      <text :content="{$$ix} -> {$$li} -> {$$ownIndex} -> {$$<ownIndex}"></text>
    </li>
  </ul>
</template>
