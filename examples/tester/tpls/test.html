<template kss-tpl-id="test">
  <text :content="$$text + '5'"></text> capo
  <table border="2">
    <tr :foreach="$$form" :as="item">
      <td><text :content="$$item.key"></text></td>
      <td><text :content="$$item.value * ##value"></text></td>
    </tr>
  </table>
  
  <span class="{$$label}a" xx="hola">IF</span>
  <button onclick="[$$sum()]">
    SUM
  </button>
  <div :if="$$value % 2 == 0" :else-ref="value_mod">
    {$$value} is par
  </div>
  <div :else="value_mod">
    {$$value} is impar
  </div>
</template>
