<template kss-tpl-id="tags">
<style>
  [kss-id="tags"] input {
    border-width: 0;
    outline: none;
  }
  .box {
    border: 1px solid gray;
    padding: 4px;
  }
  .tag {
    padding: 3px;
    border: 1px solid red;
    border-radius: 3px;
    margin-right: 3px;
    color: white;
    background-color: #c009;
  }
  
  .helper {
    position: fixed;
    height: auto;
    max-height: 25vh;
    width: 16rem;
    border: 1px solid black;
    background-color: #ddd;
    color: #555;
    overflow: scroll;
  }
    
  .hide {
    display: none;
  }
  
  
</style>

<div class="box">
  <span>
    <span class="tag" :foreach="$$tags" :as="item">{$$item}</span>
  </span>
  
  <input type="text" :bind="$$tag" onkeyup="[$$add()]"/>

  <select class="helper {$$tag == '' ? 'hide' : ''}" multiple onkeydown="[$$select()]"
       style="left: {$$helper_x}px; top: {$$helper_y}px;" >
    <option :foreach="$$helper" :as="item">
      {$$item}
    </option>
  </select>

</div>

</template>
